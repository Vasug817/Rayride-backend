<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RayGlides Driver Hub</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Outfit -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React and ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
          },
          colors: {
            cyberGreen: {
              400: '#34D399',
              500: '#10B981',
              600: '#059669',
            },
            electricBlue: {
              400: '#60A5FA',
              500: '#3B82F6',
              600: '#2563EB',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0B0F19;
      color: #F3F4F6;
      user-select: none;
    }
    /* Glassmorphism Styles */
    .glass-card {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .neon-glow-green {
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.35);
    }
    .neon-glow-blue {
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.35);
    }
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(59, 130, 246, 0.3);
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans max-w-md mx-auto relative shadow-2xl border-x border-gray-800/50">

  <div id="root" class="flex-grow flex flex-col overflow-x-hidden pb-20"></div>

  <!-- React JSX Code -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_URL = "http://localhost:5050";

    function App() {
      const [user, setUser] = useState(null);
      const [token, setToken] = useState(null);
      const [view, setView] = useState("login"); // login, signup, dashboard, map, savings
      const [telemetry, setTelemetry] = useState(null);
      const [savings, setSavings] = useState([]);
      const [loading, setLoading] = useState(false);
      const [alertMsg, setAlertMsg] = useState(null);

      // Auth states
      const [authMode, setAuthMode] = useState("password"); // password or otp
      const [email, setEmail] = useState("");
      const [phone, setPhone] = useState("");
      const [name, setName] = useState("");
      const [password, setPassword] = useState("");
      const [otpCode, setOtpCode] = useState("");
      const [sentOtpContact, setSentOtpContact] = useState("");
      
      // Auto-update timer
      useEffect(() => {
        if (!token) return;
        
        const fetchStatus = () => {
          fetch(`${API_URL}/api/driver/vehicle-status`, {
            headers: { "Authorization": `Bearer ${token}` }
          })
          .then(res => res.json())
          .then(data => {
            if (!data.error) setTelemetry(data);
          })
          .catch(err => console.log("Fetch status error:", err));
        };

        const fetchSavings = () => {
          fetch(`${API_URL}/api/driver/savings-summary`, {
            headers: { "Authorization": `Bearer ${token}` }
          })
          .then(res => res.json())
          .then(data => {
            if (!data.error) setSavings(data);
          })
          .catch(err => console.log("Fetch savings error:", err));
        };

        fetchStatus();
        fetchSavings();

        const statusInterval = setInterval(fetchStatus, 3000);
        return () => clearInterval(statusInterval);
      }, [token]);

      const showAlert = (msg, duration = 4000) => {
        setAlertMsg(msg);
        setTimeout(() => setAlertMsg(null), duration);
      };

      const handleLogin = (e) => {
        if (e) e.preventDefault();
        setLoading(true);

        const endpoint = authMode === "password" ? "/api/auth/signin-password" : "/api/auth/signin-otp";
        const body = authMode === "password" 
          ? { email, password } 
          : { contact_info: sentOtpContact, code: otpCode };

        fetch(`${API_URL}${endpoint}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: json_stringify(body)
        })
        .then(res => res.json())
        .then(data => {
          setLoading(false);
          if (data.error) {
            showAlert(data.error);
          } else {
            setToken(data.token);
            setUser(data.user);
            setView("dashboard");
            showAlert(`Welcome back, ${data.user.name}!`);
          }
        })
        .catch(err => {
          setLoading(false);
          showAlert("Connection to backend server failed.");
        });
      };

      const handleSignup = (e) => {
        e.preventDefault();
        setLoading(true);
        fetch(`${API_URL}/api/auth/signup`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: json_stringify({ name, email, phone, password })
        })
        .then(res => res.json())
        .then(data => {
          setLoading(false);
          if (data.error) {
            showAlert(data.error);
          } else {
            showAlert("Signup successful! Please sign in.");
            setView("login");
          }
        })
        .catch(err => {
          setLoading(false);
          showAlert("Signup failed. Check connection.");
        });
      };

      const sendOtp = () => {
        const contact = email || phone;
        if (!contact) return showAlert("Please enter an email or phone number first");
        
        setLoading(true);
        fetch(`${API_URL}/api/auth/send-otp`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: json_stringify({ contact_info: contact })
        })
        .then(res => res.json())
        .then(data => {
          setLoading(false);
          if (data.error) {
            showAlert(data.error);
          } else {
            setSentOtpContact(contact);
            setAuthMode("otp");
            showAlert(`OTP sent! Your testing code is: ${data.code}`);
          }
        })
        .catch(err => {
          setLoading(false);
          showAlert("Failed to send OTP.");
        });
      };

      const handleGoogleLogin = () => {
        setLoading(true);
        fetch(`${API_URL}/api/auth/google-login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: json_stringify({ email: "driver@google.com", name: "Google Driver" })
        })
        .then(res => res.json())
        .then(data => {
          setLoading(false);
          setToken(data.token);
          setUser(data.user);
          setView("dashboard");
          showAlert(`Welcome, Google User!`);
        })
        .catch(err => {
          setLoading(false);
          showAlert("Google Sign-In failed.");
        });
      };

      function json_stringify(obj) {
        return JSON.stringify(obj);
      }

      // Initialize Lucide Icons on every render
      useEffect(() => {
        lucide.createIcons();
      });

      return (
        <div className="flex flex-col min-h-screen">
          {/* Notification Alert */}
          {alertMsg && (
            <div className="fixed top-4 left-4 right-4 z-50 bg-gray-900 border-l-4 border-cyberGreen-500 p-4 rounded shadow-2xl glass-card transition-all duration-300 flex items-center gap-3">
              <i data-lucide="bell" className="text-cyberGreen-500 w-5 h-5"></i>
              <p className="text-sm font-medium">{alertMsg}</p>
            </div>
          )}

          {/* Core Content */}
          <div className="flex-grow flex flex-col">
            {view === "login" && (
              <div className="flex-grow flex flex-col justify-center p-6">
                <div className="text-center mb-8">
                  <h1 className="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyberGreen-400 to-electricBlue-500">RayGlides</h1>
                  <p className="text-gray-400 text-sm mt-1">Smart Solar EMS Driver Portal</p>
                </div>

                <div className="glass-card p-6 rounded-2xl border border-gray-800/80">
                  <h2 className="text-xl font-bold mb-4">Sign In</h2>
                  
                  {authMode === "password" ? (
                    <form onSubmit={handleLogin} className="space-y-4">
                      <div>
                        <label className="text-xs text-gray-400 block mb-1">Email ID</label>
                        <input 
                          type="email" 
                          required
                          value={email}
                          onChange={(e) => setEmail(e.target.value)}
                          className="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyberGreen-500" 
                          placeholder="driver@rayglides.com"
                        />
                      </div>
                      <div>
                        <div className="flex justify-between mb-1">
                          <label className="text-xs text-gray-400 block">Password</label>
                          <button type="button" onClick={() => setAuthMode("otp")} className="text-xs text-electricBlue-400">Sign in with OTP</button>
                        </div>
                        <input 
                          type="password" 
                          required
                          value={password}
                          onChange={(e) => setPassword(e.target.value)}
                          className="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyberGreen-500" 
                          placeholder="••••••••"
                        />
                      </div>
                      <button 
                        type="submit" 
                        disabled={loading}
                        className="w-full bg-gradient-to-r from-cyberGreen-500 to-electricBlue-600 font-bold py-2 rounded-lg text-sm hover:opacity-90 neon-glow-blue"
                      >
                        {loading ? "Authenticating..." : "Sign In with Password"}
                      </button>
                    </form>
                  ) : (
                    <form onSubmit={handleLogin} className="space-y-4">
                      <div>
                        <label className="text-xs text-gray-400 block mb-1">Email ID or Phone Number</label>
                        <div className="flex gap-2">
                          <input 
                            type="text" 
                            value={email || phone}
                            onChange={(e) => {
                              setEmail(e.target.value);
                              setPhone(e.target.value);
                            }}
                            className="flex-grow bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyberGreen-500" 
                            placeholder="Email or +91..."
                          />
                          <button 
                            type="button" 
                            onClick={sendOtp}
                            className="bg-gray-850 hover:bg-gray-800 border border-gray-700 text-xs px-3 rounded-lg font-semibold"
                          >
                            Send OTP
                          </button>
                        </div>
                      </div>
                      <div>
                        <div className="flex justify-between mb-1">
                          <label className="text-xs text-gray-400 block">One-Time OTP Code</label>
                          <button type="button" onClick={() => setAuthMode("password")} className="text-xs text-electricBlue-400">Use Password</button>
                        </div>
                        <input 
                          type="text" 
                          required
                          value={otpCode}
                          onChange={(e) => setOtpCode(e.target.value)}
                          className="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyberGreen-500 text-center tracking-widest font-mono text-lg" 
                          placeholder="000000"
                          maxLength={6}
                        />
                      </div>
                      <button 
                        type="submit"
                        disabled={loading}
                        className="w-full bg-gradient-to-r from-cyberGreen-500 to-electricBlue-600 font-bold py-2 rounded-lg text-sm hover:opacity-90 neon-glow-green"
                      >
                        {loading ? "Verifying..." : "Verify OTP & Sign In"}
                      </button>
                    </form>
                  )}

                  {/* Federated Login */}
                  <div className="relative my-6 text-center">
                    <hr className="border-gray-800" />
                    <span className="bg-[#0B0F19] text-xs text-gray-500 px-3 absolute -top-2 left-1/2 -translate-x-1/2">Or connect with</span>
                  </div>

                  <button 
                    onClick={handleGoogleLogin}
                    className="w-full bg-gray-950 hover:bg-gray-900 border border-gray-800 flex items-center justify-center gap-3 py-2 rounded-lg text-sm font-semibold transition"
                  >
                    <img src="https://www.google.com/favicon.ico" className="w-4 h-4" />
                    Sign In with Google
                  </button>

                  <div className="text-center mt-6">
                    <button onClick={() => setView("signup")} className="text-xs text-gray-400 hover:text-white">New driver? <span className="text-cyberGreen-400 font-semibold">Sign up now</span></button>
                  </div>
                </div>
              </div>
            )}

            {view === "signup" && (
              <div className="flex-grow flex flex-col justify-center p-6">
                <div className="text-center mb-8">
                  <h1 className="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyberGreen-400 to-electricBlue-500">RayGlides</h1>
                  <p className="text-gray-400 text-sm mt-1">Smart Solar EMS Driver Portal</p>
                </div>

                <div className="glass-card p-6 rounded-2xl border border-gray-800/80">
                  <h2 className="text-xl font-bold mb-4">Driver Registration</h2>
                  
                  <form onSubmit={handleSignup} className="space-y-4">
                    <div>
                      <label className="text-xs text-gray-400 block mb-1">Full Name</label>
                      <input 
                        type="text" 
                        required
                        value={name}
                        onChange={(e) => setName(e.target.value)}
                        className="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyberGreen-500" 
                        placeholder="Vasu Gupta"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-gray-400 block mb-1">Email ID</label>
                      <input 
                        type="email" 
                        required
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        className="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyberGreen-500" 
                        placeholder="driver@rayglides.com"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-gray-400 block mb-1">Phone Number</label>
                      <input 
                        type="tel" 
                        value={phone}
                        onChange={(e) => setPhone(e.target.value)}
                        className="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyberGreen-500" 
                        placeholder="+919876543210"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-gray-400 block mb-1">Password</label>
                      <input 
                        type="password" 
                        required
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        className="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyberGreen-500" 
                        placeholder="••••••••"
                      />
                    </div>
                    <button 
                      type="submit" 
                      className="w-full bg-gradient-to-r from-cyberGreen-500 to-electricBlue-600 font-bold py-2 rounded-lg text-sm hover:opacity-90 neon-glow-blue"
                    >
                      Complete Registration
                    </button>
                  </form>

                  <div className="text-center mt-6">
                    <button onClick={() => setView("login")} className="text-xs text-gray-400 hover:text-white">Already registered? <span className="text-electricBlue-400 font-semibold">Sign in</span></button>
                  </div>
                </div>
              </div>
            )}

            {view === "dashboard" && telemetry && (
              <div className="p-4 space-y-4">
                {/* Header */}
                <div className="flex justify-between items-center bg-gray-950/40 p-3 rounded-xl border border-gray-800/40">
                  <div>
                    <h3 className="text-sm text-gray-400">Driver</h3>
                    <h2 className="font-bold text-white text-base">{user.name}</h2>
                  </div>
                  <div className="text-right">
                    <span className="px-3 py-1 bg-cyberGreen-500/10 text-cyberGreen-400 text-xs rounded-full border border-cyberGreen-500/20 font-semibold uppercase tracking-wider">
                      {telemetry.license_plate}
                    </span>
                  </div>
                </div>

                {/* State Card */}
                <div className="grid grid-cols-2 gap-4">
                  {/* Glowing SOC Progress Ring */}
                  <div className="glass-card p-4 rounded-2xl flex flex-col items-center justify-center relative overflow-hidden">
                    <div className="absolute top-0 right-0 bg-cyberGreen-500/10 text-cyberGreen-400 text-[10px] px-2 py-0.5 rounded-bl font-mono">BATTERY</div>
                    <div className="relative w-28 h-28 flex items-center justify-center mt-2">
                      <svg className="w-full h-full transform -rotate-90">
                        <circle cx="56" cy="56" r="44" stroke="#1F2937" strokeWidth="8" fill="transparent" />
                        <circle 
                          cx="56" cy="56" r="44" 
                          stroke="#10B981" strokeWidth="8" fill="transparent" 
                          strokeDasharray={276}
                          strokeDashoffset={276 - (276 * telemetry.soc) / 100}
                          className="transition-all duration-500 stroke-cyberGreen-500"
                        />
                      </svg>
                      <div className="absolute text-center">
                        <span className="text-3xl font-extrabold text-white">{telemetry.soc}%</span>
                        <p className="text-[10px] text-gray-500 uppercase tracking-widest mt-0.5">SOH: {telemetry.soh}%</p>
                      </div>
                    </div>
                  </div>

                  {/* Charging Metrics */}
                  <div className="space-y-3">
                    <div className="glass-card p-3 rounded-2xl flex items-center gap-3">
                      <div className="w-9 h-9 rounded-lg bg-cyberGreen-500/10 flex items-center justify-center">
                        <i data-lucide="zap" className="text-cyberGreen-500 w-5 h-5"></i>
                      </div>
                      <div>
                        <span className="text-[10px] text-gray-400 block uppercase">EMS STATE</span>
                        <span className="font-extrabold text-sm text-white">{telemetry.state}</span>
                      </div>
                    </div>

                    <div className="glass-card p-3 rounded-2xl flex items-center gap-3">
                      <div className="w-9 h-9 rounded-lg bg-electricBlue-500/10 flex items-center justify-center animate-pulse">
                        <i data-lucide="sun" className="text-electricBlue-400 w-5 h-5"></i>
                      </div>
                      <div>
                        <span className="text-[10px] text-gray-400 block uppercase">SOLAR IN</span>
                        <span className="font-extrabold text-sm text-electricBlue-400">{telemetry.solar_power.toFixed(0)}W</span>
                      </div>
                    </div>

                    <div className="glass-card p-3 rounded-2xl flex items-center gap-3">
                      <div className="w-9 h-9 rounded-lg bg-yellow-500/10 flex items-center justify-center">
                        <i data-lucide="dollar-sign" className="text-yellow-500 w-5 h-5"></i>
                      </div>
                      <div>
                        <span className="text-[10px] text-gray-400 block uppercase">DAILY SAVINGS</span>
                        <span className="font-extrabold text-sm text-yellow-500">₹{telemetry.cost_saved.toFixed(2)}</span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Battery Details */}
                <div className="glass-card p-4 rounded-2xl space-y-3">
                  <h3 className="text-xs font-bold text-gray-400 uppercase tracking-widest border-b border-gray-800/80 pb-2">Battery & Motor Core Diagnostic</h3>
                  <div className="grid grid-cols-3 gap-2 text-center">
                    <div className="bg-gray-950/30 p-2 rounded-xl border border-gray-800/30">
                      <span className="text-[10px] text-gray-400 block uppercase">Voltage</span>
                      <span className="font-bold text-sm">{telemetry.battery_voltage.toFixed(1)}V</span>
                    </div>
                    <div className="bg-gray-950/30 p-2 rounded-xl border border-gray-800/30">
                      <span className="text-[10px] text-gray-400 block uppercase">Current</span>
                      <span className="font-bold text-sm">{telemetry.battery_current.toFixed(1)}A</span>
                    </div>
                    <div className="bg-gray-950/30 p-2 rounded-xl border border-gray-800/30">
                      <span className="text-[10px] text-gray-400 block uppercase">Temp</span>
                      <span className="font-bold text-sm text-red-400">{telemetry.battery_temp.toFixed(1)}°C</span>
                    </div>
                  </div>
                </div>

                {/* High Graphics EV Model Illustration Card */}
                <div className="glass-card p-4 rounded-2xl relative overflow-hidden flex flex-col items-center border-l-4 border-electricBlue-500">
                  <h3 className="text-sm font-bold text-white mb-2 self-start flex items-center gap-2">
                    <i data-lucide="truck" className="w-4 h-4 text-electricBlue-400"></i>
                    RayGlides Solar Loader EV
                  </h3>
                  <div className="w-full h-44 rounded-xl overflow-hidden bg-gray-950 relative border border-gray-800/50">
                    <img 
                      src={telemetry.model_type === "3_wheeler" ? "rayglides_3w_loader.jpg" : "rayglides_4w_loader.jpg"} 
                      alt="RayGlides Loader Vehicle" 
                      className="w-full h-full object-cover transition duration-300 hover:scale-105"
                      onError={(e) => {
                        e.target.onerror = null; 
                        // Seeding generic vector placeholder if local image file loading fails
                        e.target.src = "https://images.unsplash.com/photo-1558441719-ff34b0524a24?w=500&auto=format&fit=crop&q=60";
                      }}
                    />
                    <div className="absolute bottom-2 right-2 bg-gray-900/90 text-[10px] px-2 py-0.5 rounded font-mono border border-gray-800 text-electricBlue-400">
                      {telemetry.model_type === "3_wheeler" ? "3-WHEELER ECO LOADER" : "4-WHEELER HEAVY LOADER"}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {view === "map" && telemetry && (
              <div className="flex-grow flex flex-col relative min-h-[400px]">
                {/* Simulated Google Maps layout */}
                <div className="absolute inset-0 bg-gray-900 overflow-hidden flex items-center justify-center">
                  {/* Grid background representing roads */}
                  <div className="absolute inset-0 opacity-10 bg-[linear-gradient(to_right,#3B82F6_1px,transparent_1px),linear-gradient(to_bottom,#3B82F6_1px,transparent_1px)] bg-[size:40px_40px]"></div>
                  
                  {/* Mock Map Markings */}
                  <div className="absolute top-1/4 left-1/4 w-32 h-6 bg-gray-800 rounded-full blur-sm opacity-50 transform rotate-12"></div>
                  <div className="absolute bottom-1/3 right-1/4 w-40 h-8 bg-gray-850 rounded-full blur-md opacity-40 transform -rotate-45"></div>

                  {/* Map Pin representing the vehicle */}
                  <div className="absolute text-center transform -translate-x-1/2 -translate-y-1/2 transition-all duration-1000" style={{
                    top: '50%',
                    left: '50%'
                  }}>
                    {/* Glowing pulse rings */}
                    <div className="w-16 h-16 rounded-full bg-cyberGreen-500/10 absolute -left-5 -top-5 animate-ping"></div>
                    <div className="w-10 h-10 rounded-full bg-cyberGreen-500/25 absolute -left-2 -top-2 animate-pulse"></div>
                    
                    {/* Marker Icon */}
                    <div className="w-6 h-6 rounded-full bg-cyberGreen-500 border-2 border-white flex items-center justify-center shadow-lg relative z-10">
                      <i data-lucide="truck" className="w-3.5 h-3.5 text-white"></i>
                    </div>
                    
                    {/* Label */}
                    <div className="mt-2 bg-gray-950/90 text-[10px] px-2 py-0.5 rounded border border-cyberGreen-500/40 text-cyberGreen-400 font-mono shadow-2xl">
                      {telemetry.license_plate}
                    </div>
                  </div>

                  <div className="absolute bottom-4 left-4 right-4 glass-card p-4 rounded-xl space-y-2 z-20">
                    <h3 className="text-xs font-bold text-gray-400 uppercase tracking-widest">GPS VEHICLE LOCATOR</h3>
                    <div className="flex justify-between items-center text-sm">
                      <span className="text-gray-400">Position Coordinates:</span>
                      <span className="font-mono text-cyberGreen-400">{telemetry.latitude.toFixed(5)}°N, {telemetry.longitude.toFixed(5)}°E</span>
                    </div>
                    <div className="flex justify-between items-center text-sm">
                      <span className="text-gray-400">Battery Status:</span>
                      <span className="font-semibold text-white">{telemetry.soc}% Remaining (Health: {telemetry.soh}%)</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {view === "savings" && (
              <div className="p-4 space-y-4">
                {/* Totals */}
                <div className="glass-card p-5 rounded-2xl relative overflow-hidden border-l-4 border-yellow-500">
                  <div className="absolute top-0 right-0 bg-yellow-500/10 text-yellow-500 text-[10px] px-2.5 py-0.5 rounded-bl font-mono">FINANCIAL</div>
                  <h3 className="text-xs font-bold text-gray-400 uppercase tracking-widest">Lifetime Solar Savings</h3>
                  <div className="flex items-baseline gap-2 mt-2">
                    <span className="text-4xl font-extrabold text-white">₹{savings.reduce((acc, row) => acc + parseFloat(row.daily_savings || 0), 0).toFixed(2)}</span>
                    <span className="text-xs text-cyberGreen-400 font-semibold flex items-center">
                      <i data-lucide="trending-up" className="w-3.5 h-3.5 inline mr-1"></i>
                      Eco-charging active
                    </span>
                  </div>
                  <p className="text-xs text-gray-400 mt-2">Estimations calculated based on average commercial electricity grids charging tariff rates.</p>
                </div>

                {/* Savings Graph */}
                <div className="glass-card p-4 rounded-2xl space-y-3">
                  <h3 className="text-xs font-bold text-gray-400 uppercase tracking-widest border-b border-gray-800 pb-2">Weekly Savings Log</h3>
                  <div className="space-y-3">
                    {savings.map((s, idx) => (
                      <div key={idx} className="flex justify-between items-center bg-gray-950/20 p-2.5 rounded-xl border border-gray-800/30">
                        <div>
                          <span className="text-xs text-gray-400 block">{s.date}</span>
                          <span className="text-xs font-bold text-gray-300">{(s.daily_solar_wh / 1000.0).toFixed(2)} kWh generated</span>
                        </div>
                        <div className="text-right">
                          <span className="font-extrabold text-sm text-yellow-500">₹{parseFloat(s.daily_savings).toFixed(2)}</span>
                          <p className="text-[10px] text-cyberGreen-400 uppercase">saved</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* Bottom Navigation Menu */}
          {user && (
            <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-gray-950/95 backdrop-blur-md border-t border-gray-800/80 px-4 py-2 flex justify-around items-center z-40">
              <button 
                onClick={() => setView("dashboard")} 
                className={`flex flex-col items-center gap-1 text-xs ${view === "dashboard" ? "text-cyberGreen-400 font-bold" : "text-gray-400"}`}
              >
                <i data-lucide="home" className="w-5 h-5"></i>
                Home
              </button>
              <button 
                onClick={() => setView("map")} 
                className={`flex flex-col items-center gap-1 text-xs ${view === "map" ? "text-cyberGreen-400 font-bold" : "text-gray-400"}`}
              >
                <i data-lucide="map" className="w-5 h-5"></i>
                Location
              </button>
              <button 
                onClick={() => setView("savings")} 
                className={`flex flex-col items-center gap-1 text-xs ${view === "savings" ? "text-cyberGreen-400 font-bold" : "text-gray-400"}`}
              >
                <i data-lucide="dollar-sign" className="w-5 h-5"></i>
                Savings
              </button>
              <button 
                onClick={() => {
                  setToken(null);
                  setUser(null);
                  setView("login");
                }} 
                className="flex flex-col items-center gap-1 text-xs text-red-400"
              >
                <i data-lucide="log-out" className="w-5 h-5"></i>
                Logout
              </button>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
