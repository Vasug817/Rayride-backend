; RayGlides Smart EMS - PlatformIO project configuration
;
; Target board: ESP32-S3 N16R8 (16MB Flash, 8MB Octal PSRAM)
;
; We use the `lolin_s3` board profile because it natively supports 16MB flash,
; Quad SPI flash mode, and Octal SPI PSRAM, matching our exact module variant.
; This compiles the secondary bootloader with the correct 16MB configuration.
;
; Since our board is connected via an onboard USB-to-UART bridge chip (CH9102),
; we set `-DARDUINO_USB_CDC_ON_BOOT=0` and `-DARDUINO_USB_MODE=0` to force serial
; console logging to UART0 instead of redirecting it to the native USB CDC.

[env:esp32-s3-n16r8]
platform = espressif32
board = lolin_s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3
